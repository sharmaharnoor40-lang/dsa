    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20243a;
        }

        header {
            background: #202b52;
            color: white;
            padding: 25px 8%;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #dbe3ff;
        }

        .search-box {
            text-align: center;
            padding: 25px 15px;
        }

        .search-box input {
            width: 90%;
            max-width: 550px;
            padding: 14px;
            border: 1px solid #ccd2e2;
            border-radius: 10px;
            font-size: 16px;
            outline-color: #5668d8;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 40px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(250px, 1fr)
            );
            gap: 22px;
        }

        .topic-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #202b5210;
            border: 1px solid #e5e8f1;
            transition: 0.3s;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px #202b5220;
        }

        .topic-card h2 {
            font-size: 21px;
            margin-bottom: 10px;
            color: #293967;
        }

        .topic-card p {
            color: #737b91;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .topic-card button {
            width: 100%;
            background: #5265d8;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .topic-card button:hover {
            background: #394bb9;
        }

        .subtopics {
            display: none;
            margin-top: 18px;
        }

        .subtopics a {
            display: block;
            color: #394bb9;
            text-decoration: none;
            background: #f0f2ff;
            padding: 10px;
            margin-top: 8px;
            border-radius: 7px;
            font-size: 14px;
        }

        .subtopics a:hover {
            background: #dfe4ff;
        }

        .empty-message {
            display: none;
            text-align: center;
            padding: 30px;
            color: #737b91;
        }

        footer {
            background: #202b52;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer p {
            color: #dbe3ff;
            font-size: 14px;
        }
    </style>
</head>

        const grid = document.getElementById("topicGrid");

        function displayTopics(list) {
            grid.innerHTML = "";

            list.forEach((topic, index) => {
                const card = document.createElement("section");
                card.className = "topic-card";

                const heading = document.createElement("h2");
                heading.textContent = topic.icon + " " + topic.name;

                const description = document.createElement("p");
                description.textContent = topic.description;

                const button = document.createElement("button");
                button.textContent = "Explore Subtopics ▼";
                button.setAttribute("aria-expanded", "false");

                const subtopics = document.createElement("div");
                subtopics.className = "subtopics";

                topic.subtopics.forEach(([name, url]) => {
                    const link = document.createElement("a");
                    link.textContent = "➜ " + name;
                    link.href = url;

                    if (url === "#") {
                        link.addEventListener("click", function(event) {
                            event.preventDefault();
                            alert("Add your tutorial or Google Drive link for: " + name);
                        });
                    } else {
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                    }

                    subtopics.appendChild(link);
                });

                button.addEventListener("click", function() {
                    const isOpen = subtopics.style.display === "block";
                    subtopics.style.display = isOpen ? "none" : "block";
                    button.textContent = isOpen
                        ? "Explore Subtopics ▼"
                        : "Hide Subtopics ▲";
                    button.setAttribute("aria-expanded", String(!isOpen));
                });

                card.appendChild(heading);
                card.appendChild(description);
                card.appendChild(button);
                card.appendChild(subtopics);

                grid.appendChild(card);
            });

            document.getElementById("emptyMessage").style.display =
                list.length === 0 ? "block" : "none";
        }

        function searchTopics() {
            const query = document
                .getElementById("search")
                .value.toLowerCase()
                .trim();

            const filtered = topics.filter(topic =>
                topic.name.toLowerCase().includes(query) ||
                topic.description.toLowerCase().includes(query) ||
                topic.subtopics.some(subtopic =>
                    subtopic[0].toLowerCase().includes(query)
                )
            );

            displayTopics(filtered);
        }

        displayTopics(topics);
    </script>
